name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: timelines
          POSTGRES_PASSWORD: timelines-local
          POSTGRES_DB: timelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timelines"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:4.3.7-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 8s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-packages --group dev --python 3.14
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync mypy
      - name: Tests
        run: uv run --no-sync pytest backend -q

  runtime-check:
    runs-on: ubuntu-latest
    services:
      # The evaluation tests store scores in a throwaway database.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: timelines
          POSTGRES_PASSWORD: timelines-local
          POSTGRES_DB: timelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timelines"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-packages --all-groups --python 3.14
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Test the browser service
        run: uv run --no-sync pytest browser_service -q
      - name: Test the evaluation code
        run: uv run --no-sync pytest evals/tests -q -p no:cacheprovider
      - name: Check dependencies at runtime
        run: uv run --no-sync python -W ignore scripts/check_runtime.py --with-model --with-browser

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: timelines
          POSTGRES_PASSWORD: timelines-local
          POSTGRES_DB: timelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timelines"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: |
          uv sync --locked --all-packages --group dev --python 3.14
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Lint
        run: npm run lint --prefix web
      - name: Types
        run: npm run typecheck --prefix web
      - name: Unit tests
        run: npm test --prefix web
      - name: Build for the browser tests
        run: npm run build --prefix web
        env:
          API_URL: http://127.0.0.1:8001
      - name: Browser tests
        run: npm run e2e --prefix web

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Loki refuses all writes once its disk is 90% full, and these images fill a runner's disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the local stack
        run: docker compose up -d --build --wait --wait-timeout 300 api worker beat
        env:
          APP_LEASE_SECONDS: "10"
          APP_MOCK_LLM_LATENCY_SECONDS: "1"
          APP_ALLOW_MOCK_LLM: "true"
          APP_DEFAULT_PROVIDER: mock
          APP_LOCAL_ACTIVE_BRANCHES: "30"
          OBSERVABILITY_DEBUG_LOGS: "true"
      - name: Run the end-to-end and failure smoke test
        run: uv run --group dev --all-packages python scripts/smoke_local.py
      - name: Restart with the default branch cap
        run: docker compose up -d --wait api worker beat
        env:
          APP_ALLOW_MOCK_LLM: "true"
          APP_DEFAULT_PROVIDER: mock
          OBSERVABILITY_DEBUG_LOGS: "true"
      - name: Check traces, metrics, logs and dashboards
        run: uv run --group dev --all-packages python scripts/smoke_observability.py
      - name: Show logs on failure
        if: failure()
        run: |
          df -h /
          docker compose logs --tail 100 api worker beat gateway
          echo "--- observability: Loki and collector output"
          docker compose logs --no-log-prefix --tail 300 observability
          echo "--- Loki: what it received"
          curl -s http://127.0.0.1:3100/ready
          curl -s http://127.0.0.1:3100/loki/api/v1/labels
          curl -s http://127.0.0.1:3100/metrics | grep -E "^(loki_distributor_lines_received_total|loki_discarded_samples_total|loki_ingester_streams_created_total)" || true
      - name: Stop the local stack
        if: always()
        run: docker compose down -v
