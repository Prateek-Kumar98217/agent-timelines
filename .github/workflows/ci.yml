name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: timelines
          POSTGRES_PASSWORD: timelines-local
          POSTGRES_DB: timelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timelines"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:4.3.7-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 8s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-packages --group dev --python 3.14
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync mypy
      - name: Tests
        run: uv run --no-sync pytest backend -q

  runtime-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-packages --all-groups --python 3.14
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Test the browser service
        run: uv run --no-sync pytest browser_service -q
      - name: Check dependencies at runtime
        run: uv run --no-sync python -W ignore scripts/check_runtime.py --with-model --with-browser

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Start the local stack
        run: docker compose up -d --build --wait --wait-timeout 300 api worker beat
        env:
          APP_LEASE_SECONDS: "10"
          APP_MOCK_LLM_LATENCY_SECONDS: "1"
          APP_ALLOW_MOCK_LLM: "true"
          APP_DEFAULT_PROVIDER: mock
          APP_LOCAL_ACTIVE_BRANCHES: "30"
      - name: Run the end-to-end and failure smoke test
        run: uv run --group dev --all-packages python scripts/smoke_local.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100 api worker beat
      - name: Stop the local stack
        if: always()
        run: docker compose down -v
