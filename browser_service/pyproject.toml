[project]
name = "agent-timelines-browser"
version = "0.1.0"
description = "Isolated Playwright service for page_fetch"
requires-python = ">=3.14"
dependencies = ["fastapi", "playwright", "uvicorn"]

[dependency-groups]
dev = ["httpx", "pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
