[project]
name = "agent-timelines-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/app", "backend/tests"]
