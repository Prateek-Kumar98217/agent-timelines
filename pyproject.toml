[project]
name = "agent-timelines-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "browser_service"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests", "browser_service"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S608"]
"evals/**" = ["S101", "S311"]
"loadtest/**" = ["S311"]
"**/alembic/versions/**" = ["E501", "RUF"]
"loadtest/run.py" = ["S603", "S607", "S101", "PLR0124"]
"kb/**" = ["E501", "RUF001"]
"scripts/**" = ["S101", "S608", "S603", "S607", "S113"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/app", "backend/tests", "browser_service/browser_service"]
mypy_path = "backend:browser_service"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "jsonschema.*", "celery.*", "fastembed.*", "kb_labels"]
ignore_missing_imports = true
